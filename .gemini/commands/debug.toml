## File: Debugging mode/rules/triage-intake.md

# Triage Intake Rule
MODE: debugging_intake

LOAD_POLICY:
- must_read_when := error_report|test_failure|prod_incident|unexpected_behavior|regression|performance_drop|security_alert|user_complaint
- route := ../debugger.md

RULES:
- ask_precise_goal := reproduce|explain|fix
- collect := stacktrace|logs|screenshots|request_samples|env_info|versions
- severity := blocker|major|minor
- deny := vague_goal_without_signals

OUTPUT:
- intake_notes

---

## File: Debugging mode/rules/repro-harness.md

# Repro Harness Rule
MODE: debugging_repro

LOAD_POLICY:
- must_read_when := repro_needed|cannot_reproduce|unit_available|integration_available
- route := ../debugger.md

RULES:
- prefer_unit_or_small_integration := true
- record_steps := exact_inputs + observed_outputs
- inline_fixture := allowed (temporary)
- persistent_fixture := denied unless necessary

OUTPUT:
- repro_steps
- harness_snippets

---

## File: Debugging mode/rules/root-cause-hypothesis.md

# Root Cause Hypothesis Rule
MODE: debugging_hypothesis

LOAD_POLICY:
- must_read_when := repro_observed|symptom_pattern|component_suspected
- route := ../debugger.md

RULES:
- generate_prioritized_hypotheses := 3..7 items
- experiment_design := minimize_cost_maximize_signal
- choose_next := highest_signal_low_cost

OUTPUT:
- hypothesis_list
- experiment_plan

---

## File: Debugging mode/rules/instrumentation-logging.md

# Instrumentation & Logging Rule
MODE: debugging_instrumentation

LOAD_POLICY:
- must_read_when := low_signal|cannot_reproduce|need_state_visibility
- route := ../debugger.md

RULES:
- add_temp_logging|assertions|traces := minimal
- avoid := secrets|pii|performance_regressions
- cleanup := remove_temp_after_fix

OUTPUT:
- instrumentation_plan

---

## File: Debugging mode/rules/minimal-delta-fix.md

# Minimal Delta Fix Rule
MODE: debugging_fix

LOAD_POLICY:
- must_read_when := root_cause_identified|fix_ready
- route := ../debugger.md

RULES:
- fix_strategy := minimal_delta
- deny := large_refactors|scope_creep
- align_with := Developer mode/implementation rules/runtime-safety.md

OUTPUT:
- patch_list

---

## File: Debugging mode/rules/verification-debug.md

# Debug Verification Rule
MODE: debugging_verify

LOAD_POLICY:
- must_read_when := fix_applied|ready_for_test
- route := ../debugger.md

RULES:
- run := unit|integration|e2e (relevant subset)
- add_missing_tests := cover_edge_case
- acceptance := failing_case_passes AND no_regressions

OUTPUT:
- verification_result

---

## File: Debugging mode/rules/rollback-guard.md

# Rollback Guard Rule
MODE: debugging_rollback

LOAD_POLICY:
- must_read_when := fix_risky|prod_incident
- route := ../debugger.md

RULES:
- prepare_rollback_plan := true
- define_safe_toggles := feature_flag|env_gate
- confirm_backup := tests|migrations

OUTPUT:
- rollback_notes

# User arguments

{{args}}"""
